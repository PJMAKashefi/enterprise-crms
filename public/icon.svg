<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- M polygon scaled to 512x512 -->
    <clipPath id="icon-m-clip">
      <polygon points="128,420 128,210 190,210 256,330 322,210 384,210 384,420 330,420 330,295 285,380 227,380 182,295 182,420" />
    </clipPath>
  </defs>

  <!-- App Icon Background: Rich PJMAK Navy -->
  <rect width="512" height="512" rx="100" fill="#0B1E36" />

  <!-- Subtle inner gradient glow -->
  <rect x="12" y="12" width="488" height="488" rx="88" fill="none" stroke="#1E3A5F" stroke-width="4" />

  <!-- Crown above M -->
  <g transform="translate(256, 135)">
    <path d="M -75,-10 L -60,-65 L -25,-30 L 0,-85 L 25,-30 L 60,-65 L 75,-10 Z" fill="#F59E0B" />
    <rect x="-75" y="-8" width="150" height="15" rx="5" fill="#D97706" />
    <!-- Crown gems -->
    <circle cx="-42" cy="-2" r="3" fill="#FFFFFF" />
    <circle cx="0" cy="-2" r="4" fill="#FFFFFF" />
    <circle cx="42" cy="-2" r="3" fill="#FFFFFF" />
  </g>

  <!-- Letter M filled with Dutch flag stripes -->
  <rect x="110" y="200" width="292" height="74" fill="#C8102E" clip-path="url(#icon-m-clip)" />
  <rect x="110" y="274" width="292" height="74" fill="#FFFFFF" clip-path="url(#icon-m-clip)" />
  <rect x="110" y="348" width="292" height="85" fill="#21468B" clip-path="url(#icon-m-clip)" />

  <!-- Clean outline on letter M -->
  <polygon
    points="128,420 128,210 190,210 256,330 322,210 384,210 384,420 330,420 330,295 285,380 227,380 182,295 182,420"
    fill="none"
    stroke="#FFFFFF"
    stroke-width="5"
    stroke-linejoin="round"
  />

  <!-- Monogram subline 'PJMAK' -->
  <text x="256" y="475" text-anchor="middle" fill="#93C5FD" font-family="system-ui, -apple-system, BlinkMacSystemFont, sans-serif" font-weight="900" font-size="34" letter-spacing="8">PJMAK</text>
</svg>
